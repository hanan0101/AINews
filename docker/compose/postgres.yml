# PostgreSQL: durable storage for newsletter versions and course data.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainewsletter}
      POSTGRES_USER: ${POSTGRES_USER:-ainewsletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainewsletter_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainewsletter} -d ${POSTGRES_DB:-ainewsletter}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

volumes:
  postgres_data:

networks:
  newsletter_network:

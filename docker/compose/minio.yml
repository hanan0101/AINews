# MinIO: self-hosted S3-compatible object storage. Currently used as the
# pgBackRest repository target for continuous WAL archiving + backups (see
# docker/compose/postgres.yml) so a disk failure on this host does not take
# out the live database and its only backup copy together.
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ainewsletter_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ainewsletter_minio_local}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

  # One-shot bootstrap: creates the pgbackrest bucket if it doesn't already
  # exist, then exits. Safe to run on every stack start (idempotent) - same
  # pattern as seed_versions_from_sqlite_if_empty() for Postgres.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-ainewsletter_minio} ${MINIO_ROOT_PASSWORD:-ainewsletter_minio_local} &&
      mc mb --ignore-existing local/pgbackrest
      "
    networks:
      - newsletter_network
    restart: "no"

volumes:
  minio_data:

networks:
  newsletter_network:

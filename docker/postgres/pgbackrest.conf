# pgBackRest configuration: continuous WAL archiving + scheduled backups to
# a self-hosted MinIO bucket (S3-compatible). See docs/MAINTENANCE.md for
# day-to-day backup/restore commands and scripts/test_pgbackrest_restore.sh
# for the monthly restore-integrity check.
#
# repo1-s3-key / repo1-s3-key-secret are intentionally NOT set here - they
# come from the PGBACKREST_REPO1_S3_KEY / PGBACKREST_REPO1_S3_KEY_SECRET
# environment variables (pgBackRest reads these natively), set in
# docker/compose/postgres.yml so no credentials are baked into the image.

[global]
repo1-type=s3
repo1-s3-endpoint=minio:9000
repo1-s3-region=us-east-1
repo1-s3-bucket=pgbackrest
# MinIO does not support virtual-hosted-style bucket URLs (bucket.host/...),
# only path-style (host/bucket/...) - required for MinIO, harmless for AWS.
repo1-s3-uri-style=path
repo1-path=/pgbackrest
repo1-retention-full=3
repo1-retention-full-type=count
compress-type=zst
process-max=2
log-path=/var/log/pgbackrest
lock-path=/var/lib/pgbackrest

[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432

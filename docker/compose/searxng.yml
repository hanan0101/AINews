# SearXNG: self-hosted metasearch used by discovery.
# Search behavior itself comes from the upstream image; the app reaches it
# through AI_UPDATES_SEARXNG_URL=http://searxng:8080.
# No host ports: only the ainewsletter container needs to reach SearXNG, over
# the internal newsletter_network. If you need to open SearXNG's own search
# UI directly from this machine (e.g. debugging), add "127.0.0.1:8080:8080"
# back temporarily.
services:
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ../../searxng:/etc/searxng
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

networks:
  newsletter_network:

# Qdrant: vector database for semantic duplicate-content memory.
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

volumes:
  qdrant_data:

networks:
  newsletter_network:

# Runs the full AI newsletter stack: app, database, auth, and search.
name: ainewsletter_v0_1

services:
  # PostgreSQL change: store newsletter versions in a durable PostgreSQL 15
  # volume, run scheduled backups in the same container, and report readiness
  # before the application is allowed to start.
  postgres:
    build:
      context: ./docker
      dockerfile: postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ainewsletter}
      POSTGRES_USER: ${POSTGRES_USER:-ainewsletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainewsletter_local}
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-ainewsletter}
      PGUSER: ${POSTGRES_USER:-ainewsletter}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ainewsletter_local}
      BACKUP_DIR: /backups
      BACKUP_CRON: ${POSTGRES_BACKUP_CRON:-0 2 * * *}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ainewsletter} -d ${POSTGRES_DB:-ainewsletter}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

    # Manual backup command (run from the project root at any time):
    # docker compose exec postgres /usr/local/bin/postgres-backup

  # STEP 1: Add Keycloak as a separate service in docker-compose.
  # Reason: Keycloak runs independently and handles all authentication.
  # Port 8180 used to avoid conflict with existing SearXNG on 8080.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    command: start-dev
    networks:
      - newsletter_network
    restart: always

  ainewsletter:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Command documented in Dockerfile:
    # python -m backend.server.http_server
    # This single app container owns the interactive server and calls the
    # pipeline stages in-process so Generate can stream progress to the UI.
    environment:
      # PostgreSQL change: provide the application with the same credentials
      # used by the database service through Docker's internal network.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ainewsletter}
      POSTGRES_USER: ${POSTGRES_USER:-ainewsletter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ainewsletter_local}
      HOST: 0.0.0.0
      AI_UPDATES_SEARXNG_URL: http://searxng:8080
      AI_UPDATES_QDRANT_URL: http://qdrant:6333
      NEWS_JSON_PATH: /app/data/news/news.json
      PREVIOUS_NEWS_JSON_PATH: /app/data/news/news_previous.json
      AI_UPDATES_RUN_REPORT_PATH: /app/data/news/ai_updates_run_report.json
      VERSIONS_BACKUP_DIR: /app/data/backups
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_REALM: newsletter
      KEYCLOAK_CLIENT_ID: newsletter-app
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-YOUR_CLIENT_SECRET}
    depends_on:
      # PostgreSQL change: wait for a successful pg_isready health check.
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      keycloak:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend
      - ./scripts:/app/scripts
      - ./frontend:/app/frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - newsletter_network
    restart: always

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

    # Search command is provided by the upstream SearXNG image. The app calls
    # it through AI_UPDATES_SEARXNG_URL=http://searxng:8080.

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - newsletter_network
    restart: always

# PostgreSQL change: use a named volume so database records survive container
# recreation independently from the legacy SQLite backup in data/versions/.
volumes:
  postgres_data:
  # Scheduled PostgreSQL backups: this named volume stores the newest seven
  # daily SQL dumps from the PostgreSQL container.
  postgres_backups:
  # Qdrant vector database storage: preserves semantic-memory embeddings
  # independently from the application container.
  qdrant_data:

networks:
  newsletter_network:

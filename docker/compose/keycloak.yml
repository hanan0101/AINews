# Keycloak: authentication provider. Runs independently of the app.
# Port 8180 (host) avoids a conflict with SearXNG's 8080.
# Dev-mode credentials below are for local use only — change them, and drop
# `start-dev` for a real production run. See docs/DEPLOYMENT.md.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # Do not set container_name here. Compose generates a project-scoped name
    # while the service remains reachable as `keycloak` on the shared network.
    # A fixed global name prevents parallel checkouts/stacks from starting.
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8180:8080"
    command: start-dev
    # Without this, Keycloak's embedded H2 database (realm, client, roles,
    # users - everything from SETUP.md Step 4) lives only inside the
    # container's own filesystem. Any container recreation (docker compose
    # up --build, down+up, etc.) wiped it silently, so Step 4 had to be
    # redone from scratch after every rebuild - this is what made admin
    # login "stop working" after a fresh build even on an environment that
    # had already been set up once (hit in production 2026-07-12).
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - newsletter_network
    restart: always

volumes:
  keycloak_data:

networks:
  newsletter_network:
